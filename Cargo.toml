[package]
name = "cpp-guard"
version = "0.1.0"
edition = "2021"
description = "Static analysis tool for C++ safety — catches memory leaks, null pointers, unsafe casts, and more"
license = "MIT"
repository = "https://github.com/ToBeMoreSimple/cpp-guard"
keywords = ["cpp", "c++", "safety", "static-analysis", "security"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
walkdir = "2"
colored = "3"
tree-sitter = "0.25"
tree-sitter-cpp = "0.23"
toml = "0.8"

[profile.release]
opt-level = 2
lto = true
